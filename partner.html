<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicBioMate — B2B Partner Gateway</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>
<body class="partner-page-body">

    <div class="partner-page-wrap">
        <a href="index.html" class="back-home-link" aria-label="Back to home">
            <svg class="back-arrow-svg" viewBox="0 0 10 16" width="10" height="16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8.5 15L1.5 8L8.5 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>

        <main class="partner-section">
            <div class="partner-container">

                <div class="partner-header">
                    <div class="header-left-partner">
                        <a href="index.html" class="partner-brand">
                            <img src="mypictures/logo.png" alt="MicBioMate Logo" class="partner-brand-logo">
                            <div class="partner-title-wrap">
                                <span class="partner-brand-name">MicBioMate</span>
                                <span class="partner-brand-sub">MICROBIAL BIOTECH PLATFORM</span>
                            </div>
                        </a>
                    </div>

                    <div class="header-right-partner">
                        <div class="partner-status-badge">
                            <span class="status-dot"></span>
                            <span>B2B GATEWAY SECURE V4.11</span>
                        </div>

                        <div class="lang-dropdown" id="langDropdown">
                            <button class="lang-btn" id="langBtn" type="button" aria-expanded="false">
                                <span class="current-lang" id="currentLang">EN</span>
                                <span class="lang-arrow" aria-hidden="true"><svg class="icon-chevron" width="12" height="7" viewBox="0 0 12 7" fill="none"><path d="M1 1.2L6 5.8L11 1.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                            </button>
                            <div class="lang-menu" id="langMenu">
                                <button type="button" class="lang-option" data-lang="en">
                                    <span class="lang-flag lang-flag-en" aria-hidden="true"></span>
                                    <span class="lang-name">English</span>
                                </button>
                                <button type="button" class="lang-option" data-lang="de">
                                    <span class="lang-flag lang-flag-de" aria-hidden="true"></span>
                                    <span class="lang-name">German</span>
                                </button>
                                <button type="button" class="lang-option" data-lang="it">
                                    <span class="lang-flag lang-flag-it" aria-hidden="true"></span>
                                    <span class="lang-name">Italian</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="partner-divider"></div>

                <div class="partner-meta">
                    <div class="partner-sub-info">
                        <h1 class="partner-main-title" data-i18n="partner_title">B2B-PARTNERGENEHMIGUNG</h1>
                        <p class="partner-subtitle" data-i18n="partner_subtitle">Automatisches System zur Verteilung von Domain-E-Mail-Rechten</p>
                    </div>
                    <div class="partner-simulation-tag">INTERFACE SIMULATION</div>
                </div>

                <form class="partner-form" id="partnerForm">
                    <div class="input-group">
                        <input
                            type="email"
                            id="partnerEmail"
                            class="corporate-input"
                            placeholder="Corporate Email"
                            data-i18n-placeholder="placeholder_email"
                            required
                        >
                    </div>

                    <div class="checkbox-group">
                        <input type="checkbox" id="ndaConsent" required>
                        <label for="ndaConsent" data-i18n="nda_text">
                            I confirm my agreement to the terms of the MicBioMate platform's NDA and Privacy Policy regarding access to trade secrets.
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-magic-link" data-i18n="btn_send_link">Send Magic Link</button>
                    </div>
                </form>

            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
